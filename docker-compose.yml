# /docker-compose.yml
services:
  backend:
    build:
      context: ./backend
    container_name: app-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # 必要なら追加環境変数:
    # environment:
    #   - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Home.js が参照する API のベースURLをビルド時に埋め込み
        REACT_APP_API_BASE: "http://localhost:8000"
    container_name: app-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
