# /docker-compose.yml

services:
  backend:    # FastAPI
    build:
      context: ./backend
    container_name: app-backend
    # ホストPC8000 → コンテナの8000に転送
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Docker再起動時に自動で起動
    restart: unless-stopped

  frontend:   # React (静的配信)
    build:
      context: ./frontend
      args:
        # Home.js が参照する API のベースURLをビルド時に埋め込み
        REACT_APP_API_BASE: "http://localhost:8000"
    container_name: app-frontend
    # ホストPC3000 → コンテナの80に転送
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
